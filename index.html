<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto croquis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>Auto croquis</h1>
    <p class="sub">Sube una imagen y obtén un croquis con su geometría: líneas, círculos, arcos y rectángulos.</p>
  </div>
  <div class="actions">
    <label class="btn primary" for="file">Subir imagen</label>
    <input id="file" type="file" accept="image/*" hidden>
    <button class="btn" id="btnSample" type="button">Ejemplo</button>
  </div>
</header>

<main class="layout">
  <aside class="panel" aria-label="Ajustes">
    <section>
      <h2>Perfil</h2>
      <div class="chips" id="presets" role="group" aria-label="Perfiles de ajuste">
        <button type="button" class="chip on" data-p="inspeccion">Inspección</button>
        <button type="button" class="chip" data-p="plano">Plano técnico</button>
        <button type="button" class="chip" data-p="silueta">Silueta</button>
        <button type="button" class="chip" data-p="detalle">Detallado</button>
      </div>
    </section>

    <section>
      <h2>Detección</h2>
      <label class="row" for="sens"><span>Sensibilidad</span><output id="o-sens"></output></label>
      <input id="sens" type="range" min="1" max="100">
      <label class="row" for="sigma"><span>Suavizado</span><output id="o-sigma"></output></label>
      <input id="sigma" type="range" min="0" max="50">
      <label class="row" for="eps"><span>Simplificación (px)</span><output id="o-eps"></output></label>
      <input id="eps" type="range" min="5" max="120">
      <label class="row" for="minLen"><span>Largo mínimo (px)</span><output id="o-minLen"></output></label>
      <input id="minLen" type="range" min="4" max="200">
      <label class="row" for="join"><span>Unir extremos (px)</span><output id="o-join"></output></label>
      <input id="join" type="range" min="0" max="30">
      <label class="row" for="snap"><span>Ajuste a H/V (°)</span><output id="o-snap"></output></label>
      <input id="snap" type="range" min="0" max="15">
      <label class="row" for="res"><span>Resolución de trabajo</span><output id="o-res"></output></label>
      <input id="res" type="range" min="400" max="1600" step="100">
      <div class="checks">
        <label><input type="checkbox" id="circles" checked> Detectar círculos y arcos</label>
        <label><input type="checkbox" id="rects" checked> Detectar rectángulos</label>
      </div>
    </section>

    <section>
      <h2>Vista</h2>
      <label class="row" for="bg"><span>Imagen de fondo</span><output id="o-bg"></output></label>
      <input id="bg" type="range" min="0" max="100">
      <label class="row" for="lw"><span>Grosor de línea</span><output id="o-lw"></output></label>
      <input id="lw" type="range" min="5" max="60">
      <div class="checks">
        <label><input type="checkbox" id="labels" checked> Mostrar medidas</label>
        <label><input type="checkbox" id="colors" checked> Color por tipo</label>
      </div>
    </section>

    <section>
      <h2>Escala</h2>
      <div class="scale">
        <label for="unit">Unidad</label>
        <select id="unit">
          <option value="px">px</option>
          <option value="mm">mm</option>
          <option value="cm">cm</option>
          <option value="m">m</option>
        </select>
      </div>
      <p class="hint" id="scaleInfo">Sin calibrar: las medidas están en píxeles.</p>
      <button class="btn block" type="button" id="btnCalib">Calibrar con 2 puntos</button>
      <div class="calib" id="calibForm" hidden>
        <label for="calibVal">Distancia real entre los puntos</label>
        <div class="inline">
          <input id="calibVal" type="number" min="0" step="any" inputmode="decimal" placeholder="0">
          <span id="calibUnit">mm</span>
          <button class="btn primary" type="button" id="btnApplyCalib">Aplicar</button>
        </div>
      </div>
    </section>

    <section>
      <h2>Exportar</h2>
      <div class="grid2">
        <button class="btn" type="button" data-exp="svg">SVG</button>
        <button class="btn" type="button" data-exp="dxf">DXF</button>
        <button class="btn" type="button" data-exp="png">PNG</button>
        <button class="btn" type="button" data-exp="json">JSON</button>
      </div>
    </section>
  </aside>

  <section class="stage">
    <div class="tabs" role="tablist">
      <button role="tab" class="tab on" data-view="sketch" aria-selected="true">Croquis</button>
      <button role="tab" class="tab" data-view="edges" aria-selected="false">Bordes</button>
      <span class="status" id="status" role="status"></span>
    </div>
    <div class="canvasWrap" id="wrap">
      <div id="sketch"></div>
      <canvas id="edgeCanvas" hidden></canvas>
    </div>
    <div class="summary" id="summary"></div>
    <div class="tableWrap">
      <table id="tbl">
        <thead><tr><th>#</th><th>Tipo</th><th>Medida</th><th>Detalle</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
